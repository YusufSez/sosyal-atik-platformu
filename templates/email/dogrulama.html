<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>E-posta Doğrulama</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #222; max-width: 560px; margin: 0 auto; padding: 24px;">
    <p>Merhaba <strong>{{ user.username }}</strong>,</p>
    <p>{{ site_adi }}'na hoş geldiniz.</p>
    <p>Hesabınızı doğrulamak için aşağıdaki bağlantıya tıklayın.</p>
    <p style="margin: 28px 0;">
        <a href="{{ link }}"
           style="display: inline-block; background: #198754; color: #fff; text-decoration: none;
                  padding: 12px 24px; border-radius: 6px; font-weight: bold;">
            Hesabımı Doğrula
        </a>
    </p>
    <p style="font-size: 14px; color: #555;">
        Bu bağlantı <strong>{{ gecerlilik_saat }} saat</strong> boyunca geçerlidir.
    </p>
    <p style="font-size: 13px; color: #777;">
        Bağlantı çalışmazsa şu adresi tarayıcınıza yapıştırın:<br>
        <a href="{{ link }}">{{ link }}</a>
    </p>
</body>
</html>
