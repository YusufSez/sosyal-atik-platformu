<div class="card shadow-sm mb-4" id="predictionPanel">
  <div class="card-header fw-bold d-flex flex-wrap justify-content-between align-items-center gap-2">
    <span><i class="bi bi-graph-up-arrow me-2"></i>AI Prediction Engine</span>
    <div class="d-flex flex-wrap gap-2 align-items-center">
      <label class="small text-muted mb-0">Analiz penceresi</label>
      <select id="predictionLookback" class="form-select form-select-sm" style="width:auto">
        <option value="12" selected>Son 12 ay</option>
        <option value="24">Son 24 ay</option>
        <option value="36">Son 36 ay</option>
      </select>
    </div>
  </div>
  <div class="card-body">
    <p class="small text-muted mb-3">
      Atık · kategori artışı · teslim · katılım · CO₂ · 7 gün / 30 gün / 90 gün / 6 ay / 12 ay ·
      güven aralığı · trend · risk · AI yorumu
    </p>

    <div class="d-flex flex-wrap gap-2 mb-3" id="predictionHorizonTabs" role="tablist">
      <button type="button" class="btn btn-sm btn-success" data-horizon="7">7 gün</button>
      <button type="button" class="btn btn-sm btn-outline-secondary" data-horizon="30">30 gün</button>
      <button type="button" class="btn btn-sm btn-outline-secondary" data-horizon="90">90 gün</button>
      <button type="button" class="btn btn-sm btn-outline-secondary" data-horizon="180">6 ay</button>
      <button type="button" class="btn btn-sm btn-outline-secondary" data-horizon="365">12 ay</button>
    </div>

    <div class="table-responsive mb-3 d-none d-md-block">
      <table class="table table-sm align-middle mb-0" id="predictionMetricsTable">
        <thead>
          <tr>
            <th>Metrik</th>
            <th>Tahmin</th>
            <th>Güven</th>
            <th>Aralık</th>
            <th>Trend</th>
            <th>Risk</th>
            <th>AI yorumu</th>
          </tr>
        </thead>
        <tbody id="predictionMetricsBody">
          <tr><td colspan="7" class="text-muted">Yükleniyor…</td></tr>
        </tbody>
      </table>
    </div>

    <div class="row g-3 mb-3 d-md-none" id="predictionMetricCards"></div>

    <div class="row g-3 mb-3">
      <div class="col-12 col-lg-6">
        <canvas id="predictionHistoryChart" height="220"></canvas>
      </div>
      <div class="col-12 col-lg-6">
        <canvas id="predictionForecastChart" height="220"></canvas>
      </div>
    </div>

    <div class="border rounded p-3 bg-light-subtle">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
        <strong>AI Özet</strong>
        <span class="badge bg-secondary" id="predictionNarrativeSource">—</span>
      </div>
      <ul class="mb-0 ps-3" id="predictionNarratives">
        <li class="text-muted">Yükleniyor…</li>
      </ul>
    </div>
  </div>
</div>
