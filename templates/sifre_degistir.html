{% extends "layout.html" %}
{% block content %}

<div class="d-flex justify-content-center mt-4">
    <div class="card form-card w-100" style="max-width: 450px;">
        <div class="card-header-custom">
            <h3><i class="bi bi-key me-2"></i>Şifre Değiştir</h3>
        </div>
        <div class="card-body p-4">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">Mevcut Şifre</label>
                <input type="password" name="mevcut_sifre" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Yeni Şifre</label>
                <input type="password" name="yeni_sifre" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Yeni Şifre (Tekrar)</label>
                <input type="password" name="yeni_sifre_tekrar" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Güncelle</button>
        </form>
        <a href="{{ url_for('auth.profil') }}" class="btn btn-link mt-2">Profile Dön</a>
        </div>
    </div>
</div>

{% endblock %}
