<form method="GET" class="row g-2 align-items-end mb-3 belediye-filters" id="belediyeFilterForm"
      data-geo-url="{{ url_for('belediye.api_geography') }}">
  <div class="col-12 col-sm-6 col-md-3">
    <label class="form-label small mb-1">İl</label>
    <select name="il" id="filtreIl" class="form-select form-select-sm">
      <option value="">Tümü</option>
      {% for il in iller %}
      <option value="{{ il }}" {% if secili_il == il %}selected{% endif %}>{{ il }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-12 col-sm-6 col-md-3">
    <label class="form-label small mb-1">İlçe</label>
    <select name="ilce" id="filtreIlce" class="form-select form-select-sm">
      <option value="">Tümü</option>
      {% for ilce in ilceler %}
      <option value="{{ ilce }}" {% if secili_ilce == ilce %}selected{% endif %}>{{ ilce }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-12 col-sm-6 col-md-3">
    <label class="form-label small mb-1">Mahalle</label>
    <select name="mahalle" id="filtreMahalle" class="form-select form-select-sm">
      <option value="">Tümü</option>
      {% for m in mahalleler %}
      <option value="{{ m }}" {% if secili_mahalle == m %}selected{% endif %}>{{ m }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-12 col-sm-6 col-md-3 d-flex gap-2">
    <button type="submit" class="btn btn-sm btn-success flex-grow-1">Filtrele</button>
    <a href="{{ url_for(request.endpoint) }}" class="btn btn-sm btn-outline-secondary">Temizle</a>
  </div>
  {% if extra_fields is defined %}{{ extra_fields }}{% endif %}
</form>
<script src="{{ url_for('static', filename='js/belediye-geo-filters.js') }}"></script>
