{% extends "layout.html" %}
{% block content %}

<div class="content-section">
    <div class="page-header mb-4">
        <h3><i class="bi bi-broadcast"></i> SocketIO Test</h3>
        <small class="text-muted">Flask-SocketIO altyapı bağlantı kontrolü</small>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <p class="mb-2">
                Durum:
                <span id="socket-status" class="badge bg-secondary">Bağlanıyor...</span>
            </p>
            <p id="socket-message" class="text-muted mb-0">Oturum: {{ current_user.username }}</p>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='vendor/socket.io.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/socket-test.js') }}"></script>
{% endblock %}
