<form method="GET" class="row g-2 align-items-end mb-3 ministry-filters" id="ministryFilterForm"
      data-drill-url="{{ url_for('admin_ministry.api_drilldown') }}">
  <div class="col-6 col-md-4 col-lg">
    <label class="form-label small mb-1">İl</label>
    <select name="il" id="minFiltreIl" class="form-select form-select-sm">
      <option value="">Türkiye</option>
      {% for il in iller %}
      <option value="{{ il }}" {% if secili_il == il %}selected{% endif %}>{{ il }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-6 col-md-4 col-lg">
    <label class="form-label small mb-1">İlçe</label>
    <select name="ilce" id="minFiltreIlce" class="form-select form-select-sm">
      <option value="">Tümü</option>
      {% for ilce in ilceler %}
      <option value="{{ ilce }}" {% if secili_ilce == ilce %}selected{% endif %}>{{ ilce }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-6 col-md-4 col-lg">
    <label class="form-label small mb-1">Kategori</label>
    <select name="kategori" class="form-select form-select-sm">
      <option value="">Tümü</option>
      {% for k in kategoriler or [] %}
      <option value="{{ k }}" {% if secili_kategori == k %}selected{% endif %}>{{ k }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-6 col-md-4 col-lg">
    <label class="form-label small mb-1">Tarih</label>
    <select name="tarih" class="form-select form-select-sm">
      <option value="" {% if not secili_tarih %}selected{% endif %}>Tümü</option>
      <option value="7" {% if secili_tarih == '7' %}selected{% endif %}>Son 7 gün</option>
      <option value="30" {% if secili_tarih == '30' %}selected{% endif %}>Son 30 gün</option>
      <option value="90" {% if secili_tarih == '90' %}selected{% endif %}>Son 90 gün</option>
    </select>
  </div>
  <div class="col-6 col-md-4 col-lg">
    <label class="form-label small mb-1">Belediye tipi</label>
    <select name="belediye_tipi" class="form-select form-select-sm">
      <option value="" {% if not secili_belediye_tipi %}selected{% endif %}>Tümü</option>
      <option value="ilce" {% if secili_belediye_tipi == 'ilce' %}selected{% endif %}>İlçe belediyesi</option>
      <option value="merkez" {% if secili_belediye_tipi == 'merkez' %}selected{% endif %}>Merkez</option>
    </select>
  </div>
  <div class="col-6 col-md-4 col-lg">
    <label class="form-label small mb-1">Belediye</label>
    <select name="belediye_id" id="minFiltreBelediye" class="form-select form-select-sm">
      <option value="">Tümü</option>
      {% for b in belediyeler %}
      <option value="{{ b.id }}" {% if secili_belediye_id == b.id|string %}selected{% endif %}>
        {{ b.ad }}{% if b.ilce %} ({{ b.ilce }}){% endif %}
      </option>
      {% endfor %}
    </select>
  </div>
  <div class="col-6 col-md-4 col-lg">
    <label class="form-label small mb-1">Kurum</label>
    <select name="kurum_id" id="minFiltreKurum" class="form-select form-select-sm">
      <option value="">Tümü</option>
      {% for k in kurumlar %}
      <option value="{{ k.id }}" {% if secili_kurum_id == k.id|string %}selected{% endif %}>
        {{ k.ad }}
      </option>
      {% endfor %}
    </select>
  </div>
  <div class="col-12 col-lg-auto d-flex gap-2">
    <button type="submit" class="btn btn-sm btn-success">Filtrele</button>
    <a href="{{ url_for('admin_ministry.dashboard') }}" class="btn btn-sm btn-outline-secondary">Temizle</a>
  </div>
</form>
<script src="{{ url_for('static', filename='js/ministry-geo-filters.js') }}"></script>
