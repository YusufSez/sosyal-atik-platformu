# Üretim: Nginx (HTTPS) + Gunicorn + Certbot
# Kullanım:
#   1. deploy/nginx.conf içinde DOMAIN değerini değiştirin
#   2. docker compose -f docker-compose.prod.yml up -d
#   3. İlk sertifika: docker compose -f deploy/docker-compose.prod.yml run --rm certbot certonly ...

services:
  web:
    build: ..
    env_file:
      - ../.env
    environment:
      BEHIND_PROXY: "true"
      FORCE_HTTPS: "true"
    volumes:
      - ../site.db:/app/site.db
      - ../static/item_pics:/app/static/item_pics
      - ../static/profile_pics:/app/static/profile_pics
    restart: unless-stopped
    expose:
      - "5000"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - web
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h; done"

volumes:
  certbot_www:
  certbot_certs:
