# Üretim: PostgreSQL + Nginx + Gunicorn (+ isteğe bağlı Certbot)
#
# İlk kurulum:
#   1) Proje kökünde .env dosyasında POSTGRES_PASSWORD ve SECRET_KEY tanımlayın
#   2) cd deploy && docker compose -f docker-compose.prod.yml up --build -d
#
# SQLite veri aktarımı (isteğe bağlı):
#   docker compose -f docker-compose.prod.yml --profile migrate run --rm migrate-sqlite

services:
  postgres:
    image: postgres:17
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atikport}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # İsteğe bağlı: docker compose --profile redis -f docker-compose.prod.yml up -d
  redis:
    image: redis:7-alpine
    profiles:
      - redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      USE_POSTGRES: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-atikport}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      BEHIND_PROXY: ${BEHIND_PROXY:-true}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
      AUTO_CREATE_DB: "false"
      RATELIMIT_BACKEND: ${RATELIMIT_BACKEND:-memory}
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-memory://}
      REDIS_URL: ${REDIS_URL:-}
      RATELIMIT_STRICT: ${RATELIMIT_STRICT:-false}
      SOCKETIO_CORS_ORIGINS: ${SOCKETIO_CORS_ORIGINS}
      BACKUP_ENABLED: "false"
      GUNICORN_WORKER_CLASS: eventlet
      GUNICORN_WORKERS: "1"
      SOCKETIO_ASYNC_MODE: eventlet
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; r=urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5); d=json.load(r); exit(0 if r.getcode()==200 and d.get('status')=='ok' else 1)",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    volumes:
      - ../static/item_pics:/app/static/item_pics
      - ../static/profile_pics:/app/static/profile_pics
      - ../data/support_attachments:/app/data/support_attachments
      - ../logs:/app/logs
    restart: unless-stopped
    expose:
      - "5000"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.http.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  # SQLite → PostgreSQL tek seferlik aktarım
  migrate-sqlite:
    profiles:
      - migrate
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      USE_POSTGRES: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-atikport}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      AUTO_CREATE_DB: "false"
      SKIP_APP_BOOTSTRAP: "true"
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-memory://}
      MAIL_SUPPRESS_SEND: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../site.db:/import/site.db:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        python scripts/wait_for_postgres.py &&
        python scripts/migrate_sqlite_to_postgres.py
        --sqlite-path $${SQLITE_IMPORT_PATH:-/import/site.db}

  certbot:
    image: certbot/certbot:latest
    profiles:
      - ssl
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h; done"

  certbot-init:
    image: certbot/certbot:latest
    profiles:
      - ssl-init
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint:
      - certbot
      - certonly
      - --webroot
      - -w
      - /var/www/certbot
      - -d
      - atikport.com
      - -d
      - www.atikport.com
      - --email
      - ${CERTBOT_EMAIL:-admin@atikport.com}
      - --agree-tos
      - --no-eff-email
      - --non-interactive

volumes:
  pgdata:
  certbot_www:
  certbot_certs:
