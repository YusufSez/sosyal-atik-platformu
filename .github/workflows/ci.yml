name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      TESTING: "True"
      SECRET_KEY: test-secret
      DATABASE_URL: sqlite://
      MAIL_SUPPRESS_SEND: "True"
      USE_POSTGRES: "False"
      FLASK_ENV: testing
      RATELIMIT_STORAGE_URI: memory://
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (syntax only)
        run: |
          pip install ruff
          ruff check . --select E9,F63,F7,F82 --extend-exclude migrations

      - name: Run tests
        run: pytest

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build .

      - name: Build compose stack
        run: |
          touch .env
          docker compose build
